name: Gemini AI Website Agent

on:
  issues:
    types: [opened]

jobs:
  ai-code-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Create Agent Script
        run: |
          cat << 'EOF' > script.py
          import os, glob, re
          from google import genai

          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              print("ERROR: GEMINI_API_KEY is missing in Repository Secrets.")
              exit(1)

          client = genai.Client(api_key=api_key)
          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_body = os.environ.get('ISSUE_BODY', '')

          code_context = ''
          for ext in ['*.tsx', '*.jsx', '*.js', '*.ts', '*.html', '*.json']:
              for filepath in glob.glob(f'**/{ext}', recursive=True):
                  if any(x in filepath for x in ['node_modules', '.next', '.git']):
                      continue
                  try:
                      with open(filepath, 'r', encoding='utf-8') as f:
                          code_context += f'\n--- FILE: {filepath} ---\n' + f.read()
                  except Exception:
                      pass

          prompt = f"""You are an expert full-stack web developer.
          Task: {issue_title}
          Details: {issue_body}

          Current Code Base:
          {code_context[:30000]}

          Return file updates in EXACT format:
          FILE: <filepath>
          ```
          <content>
          ```
          """

          try:
              response = client.models.generate_content(
                  model='gemini-2.5-flash',
                  contents=prompt
              )
              text = response.text
              matches = re.findall(r'FILE:\s*([^\n]+)\n```[a-zA-Z]*\n(.*?)\n```', text, re.DOTALL)
              for filepath, content in matches:
                  filepath = filepath.strip()
                  if os.path.dirname(filepath):
                      os.makedirs(os.path.dirname(filepath), exist_ok=True)
                  with open(filepath, 'w', encoding='utf-8') as f:
                      f.write(content.strip())
                  print(f'Updated file: {filepath}')
          except Exception as e:
              print(f"Gemini API Error: {e}")
              exit(1)
          EOF

      - name: Run Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 script.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Gemini-AI-Agent"
          git config --global user.email "ai-agent@github.com"
          rm -f script.py
          git add .
          git commit -m "AI Auto-update: ${{ github.event.issue.title }}" || exit 0
          git push

      - name: Comment on Issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **AI Agent Update Complete!**
            আপনার নির্দেশ অনুযায়ী ওয়েবসাইট কোড আপডেট করা হয়েছে। Vercel-এ অটোমেশন বিল্ডিং শুরু হয়ে গেছে।
